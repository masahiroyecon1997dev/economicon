name: "Security Scan"

on:
  # dev / main ブランチへの PR 時に実行
  pull_request:
    branches: ["dev", "main"]
  # 手動での実行を可能にする
  workflow_dispatch:

permissions: {}

jobs:
  python-audit:
    name: Python Dependency Check (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"
          enable-cache: true

      - name: Python Dependency Check (pip-audit)
        run: |
          cd api
          uv sync --group dev
          uv run pip-audit

  react-audit:
    name: React Dependency Check (pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install React dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: React Dependency Check (pnpm audit)
        working-directory: ./app
        run: pnpm audit --audit-level high

  rust-audit:
    name: Rust Dependency Check (cargo-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # 1.17.0

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: v1-${{ runner.os }}-cargo-audit

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit &> /dev/null; then
            cargo install cargo-audit
          fi

      - name: Run cargo-audit
        working-directory: ./app/src-tauri
        run: cargo audit

  video-playwright-audit:
    name: Video Playwright Dependency Check (pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          cache: "pnpm"
          cache-dependency-path: "video/playwright/pnpm-lock.yaml"

      - name: Install Video Playwright dependencies
        working-directory: ./video/playwright
        run: pnpm install --frozen-lockfile

      - name: Video Playwright Dependency Check (pnpm audit)
        working-directory: ./video/playwright
        run: pnpm audit --audit-level high

  video-remotion-audit:
    name: Video Remotion Dependency Check (pnpm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          cache: "pnpm"
          cache-dependency-path: "video/remotion/pnpm-lock.yaml"

      - name: Install Video Remotion dependencies
        working-directory: ./video/remotion
        run: pnpm install --frozen-lockfile

      - name: Video Remotion Dependency Check (pnpm audit)
        working-directory: ./video/remotion
        run: pnpm audit --audit-level high

  supply-chain-freshness-check:
    name: Supply Chain Freshness Check (新規パッケージ日齢確認)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # base ブランチの履歴を git show で参照するため全履歴が必要
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.11+ で tomllib が標準搭載。外部依存ゼロで動作する。
          python-version: "3.14"

      - name: Determine base ref and fetch
        id: vars
        run: |
          # PR の場合は github.base_ref、workflow_dispatch の場合は main にフォールバック
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="main"
            echo "workflow_dispatch: base-ref を main にフォールバックします。"
          fi
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$BASE_REF"

      - name: Check package freshness
        run: |
          python packaging/deps/check_new_packages.py \
            --base-ref "origin/${{ steps.vars.outputs.base_ref }}" \
            --days 10 \
            --mode error
