name: API Test CI

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "api/**"
  pull_request:
    branches: ["dev"]
    paths:
      - "api/**"

permissions: {}

jobs:
  build:
    # Python gold benchmark の生成環境に寄せて、
    # 数値比較が runner 更新で揺れないように固定する。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14.3"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"
      # Python のインストール
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 依存関係のインストール
      - name: Install dependencies
        working-directory: ./api
        run: uv sync --group dev

      # Linterの実行
      - name: Lint with ruff
        working-directory: ./api
        run: uv run ruff check .

      # テスト用設定ファイルを作成（日本語ロケールを強制）
      - name: Create test settings file (force Japanese locale)
        run: |
          mkdir -p ~/.economicon
          echo '{"general": {"language": "ja"}}' > ~/.economicon/economicon.config.json

      # テストとカバレッジの実行
      - name: Run tests with coverage
        working-directory: ./api
        run: uv run pytest tests --cov=economicon --cov-report=xml --cov-report=term

      # カバレッジレポートのアップロード
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          file: ./api/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }} # v4以降はトークン推奨
