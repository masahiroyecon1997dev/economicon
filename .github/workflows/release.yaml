name: Release Build (Windows Installer + Portable)
# Windows NSIS インストーラー（.exe）とポータブル版（.zip）をビルドして Artifacts に格納する。
# 現在はテスト段階のため workflow_dispatch のみで手動実行。
# 正式リリース時は tag トリガー (tags: ["v*"]) に切り替えること。

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-windows-release:
    name: Build Windows Release Artifacts
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest-10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install frontend dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # 1.17.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.0 --locked --features cli

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      # -----------------------------------------------------------------------
      # build/build.ps1 STEP 1-9 相当
      # -CI スイッチにより STEP 0（前提ツール確認・対話プロンプト）をスキップして実行
      # -----------------------------------------------------------------------
      - name: Build Windows release artifacts (packaging/build/build.ps1 -CI -PackageTarget all)
        shell: pwsh
        run: .\packaging\build\build.ps1 -CI -PackageTarget all

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: economicon-windows-installer
          path: packaging/build/release/*.exe
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: economicon-windows-portable
          path: packaging/build/release/*.zip
          retention-days: 14
