name: Release Build (Windows Installer)
# Windows NSIS インストーラー（.exe）をビルドして Artifacts に格納する。
# 現在はテスト段階のため workflow_dispatch のみで手動実行。
# 正式リリース時は tag トリガー (tags: ["v*"]) に切り替えること。

on:
  workflow_dispatch:

permissions: {}

jobs:
  build-windows-installer:
    name: Build Windows Installer (NSIS)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: latest-10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install frontend dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # 1.16.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.8.4 --locked

      - name: Install uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      # -----------------------------------------------------------------------
      # build/build.ps1 STEP 1-9 相当
      # -CI スイッチにより STEP 0（前提ツール確認・対話プロンプト）をスキップして実行
      # -----------------------------------------------------------------------
      - name: Build Windows installer (packaging/build/build.ps1 -CI)
        shell: pwsh
        run: .\packaging\build\build.ps1 -CI

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: economicon-windows-installer
          path: packaging/build/release/*.exe
          retention-days: 14
