name: Frontend Test CI

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "app/**"
  pull_request:
    branches: ["dev"]
    paths:
      - "app/**"

permissions: {}

jobs:
  unit-test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest-10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: ./app
        run: pnpm test --run

      - name: Run unit tests with coverage
        working-directory: ./app
        run: pnpm test:coverage --run

      - name: Upload coverage reports
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./app/coverage/coverage-final.json
          flags: unittests
          name: vitest-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-test:
    name: E2E Tests (Tauri/Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest-10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.15.0"
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install frontend dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # 1.16.1

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      - name: Prepare sidecar runtime resources
        # E2E では本物の runtime/resources を用意して sidecar を起動する。
        # build.ps1 のうち、runtime 展開に必要な最小処理だけをここで実行する。
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PYTHON_VERSION = "3.14.3"
          $PYTHON_VERSION_SHORT = "314"
          $RESOURCES_DIR = "app\src-tauri\resources"
          $RUNTIME_DIR = Join-Path $RESOURCES_DIR "runtime"
          $SITE_PACKAGES_DIR = Join-Path $RUNTIME_DIR "site-packages"
          $BINARIES_DIR = "app\src-tauri\binaries"
          $REQ_FILE_TMP = Join-Path $env:RUNNER_TEMP "economicon-e2e-requirements.txt"
          $ZIP = Join-Path $env:RUNNER_TEMP "python_embed_tmp.zip"
          $EXTRACT = Join-Path $env:RUNNER_TEMP "python_embed_tmp"

          if (Test-Path $RESOURCES_DIR) {
            Remove-Item -Recurse -Force $RESOURCES_DIR
          }
          if (Test-Path $BINARIES_DIR) {
            Remove-Item -Recurse -Force $BINARIES_DIR
          }

          New-Item -ItemType Directory -Path $SITE_PACKAGES_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $BINARIES_DIR -Force | Out-Null

          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$PYTHON_VERSION/python-$PYTHON_VERSION-embed-amd64.zip" -OutFile $ZIP -UseBasicParsing
          Expand-Archive -Path $ZIP -DestinationPath $EXTRACT -Force
          Copy-Item "$EXTRACT\*" -Destination $RUNTIME_DIR -Recurse -Force

          $pthFile = Get-ChildItem $RUNTIME_DIR -Filter "*._pth" | Select-Object -First 1
          if (-not $pthFile) {
            throw "Embedded Python の ._pth ファイルが見つかりません。"
          }

          $pthContent = @"
          .
          python$PYTHON_VERSION_SHORT.zip
          site-packages
          import site
          "@
          [System.IO.File]::WriteAllText(
            $pthFile.FullName,
            $pthContent.TrimStart(),
            [System.Text.Encoding]::UTF8
          )

          Copy-Item (Join-Path $RUNTIME_DIR "python.exe") -Destination (Join-Path $BINARIES_DIR "python-x86_64-pc-windows-msvc.exe") -Force

          $SITE_PACKAGES_DIR_ABS = (Resolve-Path $SITE_PACKAGES_DIR).Path
          Push-Location "api"
          try {
            uv export --frozen --no-dev --no-hashes --no-annotate --quiet --output-file $REQ_FILE_TMP
            uv python install $PYTHON_VERSION
            uv pip install --python $PYTHON_VERSION --target $SITE_PACKAGES_DIR_ABS --no-cache -r $REQ_FILE_TMP
          }
          finally {
            Pop-Location
            Remove-Item $REQ_FILE_TMP -Force -ErrorAction SilentlyContinue
          }

          Copy-Item "api\main.py" -Destination (Join-Path $RESOURCES_DIR "main.py") -Force

          $economiconDst = Join-Path $SITE_PACKAGES_DIR "economicon"
          if (Test-Path $economiconDst) {
            Remove-Item -Recurse -Force $economiconDst
          }
          Copy-Item "api\economicon" -Destination $economiconDst -Recurse -Force
          Get-ChildItem $economiconDst -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

          Remove-Item -Recurse -Force $ZIP, $EXTRACT

      - name: Build Tauri debug binary
        # beforeBuildCommand (pnpm build) も自動実行される
        # --no-bundle: NSIS インストーラー生成をスキップしバイナリのみ生成
        working-directory: ./app
        run: pnpm exec tauri build --debug --no-bundle

      - name: Get Playwright version
        id: playwright-version
        working-directory: ./app
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./app
        run: pnpm exec playwright install chromium --with-deps

      - name: Install Playwright System Deps (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./app
        run: pnpm exec playwright install-deps chromium

      - name: Setup economicon configuration for CI
        shell: powershell
        run: |
          # アプリの設定ファイルの配置先ディレクトリを作成
          $configDir = "C:\Users\runneradmin\AppData\Roaming\economicon"
          if (!(Test-Path $configDir)) {
              New-Item -ItemType Directory -Force -Path $configDir
          }

          # テスト用データ（sampleフォルダ）の絶対パスを取得（スラッシュ区切りに変換）
          $samplePath = "${{ github.workspace }}/app/sample" -replace '\\', '/'

          # テンプレートを読み込み、パスを置換してターゲットラインに書き出し
          $template = Get-Content -Raw -Path "${{ github.workspace }}/app/e2e/fixtures/cicd_test.config.json"
          $configContent = $template -replace 'TARGET_PATH', $samplePath

          $configContent | Out-File -FilePath "$configDir\economicon.config.json" -Encoding utf8

          # 念のため配置された内容を確認（デバッグ用）
          Get-Content -Path "$configDir\economicon.config.json"

      - name: Start Economicon with CDP debug port
        # sidecar を含む通常起動で実行し、CDP ポートが実際に開くまで待機する
        # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: WebView2 に CDP ポートを開放させる
        working-directory: ./app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ECONOMICON_DEV_RUN = "false"
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $process = Start-Process -FilePath ".\src-tauri\target\debug\Economicon.exe" -PassThru
          $cdpReady = $false

          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if ($process.HasExited) {
              throw "Economicon.exe exited before CDP port became ready."
            }

            try {
              Invoke-WebRequest -Uri "http://127.0.0.1:9222/json/version" -UseBasicParsing | Out-Null
              $cdpReady = $true
              break
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $cdpReady) {
            throw "CDP port 9222 did not become ready in time."
          }

      - name: Run E2E tests
        working-directory: ./app
        env:
          ECONOMICON_TEST_SAMPLE_DIR: ${{ github.workspace }}/sample
        run: pnpm test:e2e --project=tauri

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-tauri
          path: app/playwright-report/
          retention-days: 30

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest-10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "app/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./app
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./app
        run: pnpm lint
