name: Workflow Pinning Lint

on:
  pull_request:
    branches: ["dev", "main"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions: {}

jobs:
  lint-pinned-actions:
    name: Lint Pinned Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate uses are pinned to full SHA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflow_dir = Path(".github/workflows")
          pattern = re.compile(r"^\s*-?\s*uses:\s*(\S.*\S|\S)\s*$")
          pinned = re.compile(r"^[^@\s]+@[0-9a-f]{40}(?:\s+#.*)?$")
          local_ref = re.compile(r"^\./")

          failures = []

          for path in sorted(workflow_dir.glob("*.y*ml")):
              for lineno, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), 1
              ):
                  match = pattern.match(line)
                  if not match:
                      continue
                  ref = match.group(1)
                  if local_ref.match(ref):
                      continue
                  if not pinned.match(ref):
                      failures.append(f"{path}:{lineno}: {ref}")

          if failures:
              print(
                  "The following uses: entries are not pinned to a full 40-character SHA:"
              )
              for item in failures:
                  print(f"  - {item}")
              sys.exit(1)

          print("All workflow uses: entries are pinned to full SHAs.")
          PY
